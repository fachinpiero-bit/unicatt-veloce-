const L=[['mic',1,'09:00','11:00','Aula G.015'],['sta',1,'14:00','16:00','Aula C.110'],['dpr',2,'09:00','11:00','Aula G.012'],['sto',2,'11:15','13:15','Aula NI.110'],['mic',3,'11:15','13:15','Aula G.015'],['sta',4,'09:00','11:00','Aula C.110'],['dpr',4,'14:00','16:00','Aula G.012'],['sto',5,'11:15','13:15','Aula NI.110'],

const X=[['p1','mic','2026-10-27','09:00','Aula G.015',1],['p2','sta','2026-10-29','14:00','Aula C.110',1],['e1','mic','2027-01-12','09:00','Aula G.015'],['e2','sta','2027-01-14','14:00','Aula C.110'],['e3','dpr','2027-01-19','09:00','Aula G.012'],['e4','sto','2027-01-21','10:00','Aula NI.110'],['e5','mic','2027-02-09','09:00','Aula G.015'],['e6','sta','2027-02-11','14:00','Aula C.110'],['e7','dpr','2027-02-16','09:00','Aula G.012'],['e8','sto','2027-02-18','10:00','Aula NI.110'],['p3','mac','2027-04-13','09:00','Aula G.015',1],['p4','rag','2027-04-15','09:00','Aula G.012',1],['e9','mac','2027-06-09','09:00','Aula G.015'],['e10','rag','2027-06-11','09:00','Aula G.012'],['e11','dco','2027-06-16','14:00','Aula C.110'],['e12','inf','2027-06-22','11:00','Sala PC N.012'],['e13','ing','2027-06-24','15:00','Sala PC N.011'],['e14','mac','2027-07-07','09:00','Aula G.015'],['e15','rag','2027-07-09','09:00','Aula G.012'],['e16','dco','2027-07-14','14:00','Aula C.110'],['e17','mic','2027-09-01','09:00','Aula G.015'],['e18','sta','2027-09-03','14:00','Aula C.110']].map(([id,c,z,t,r,p])=>({id,c,d:dt(z),t,r,p:!!p}));
const ses=e=>(e.p?'Prova intermedia':'Sessione '+sn(e.d.getMonth()))+' '+e.d.getFullYear();
// Fasi dal calendario ufficiale Facoltà di Economia, Milano 2026/27. L lezioni, P prove intermedie, R recupero, E esami, H vacanze
const PH=[['2026-09-14','2026-12-05','L'],['2026-10-26','2026-10-31','P'],['2026-12-06','2026-12-08','H'],['2026-12-09','2026-12-12','L'],['2026-12-14','2026-12-19','R'],['2026-12-20','2027-01-06','H'],['2027-01-07','2027-02-20','E'],['2027-02-22','2027-03-24','L'],['2027-03-25','2027-03-29','H'],['2027-03-30','2027-03-31','R'],['2027-04-01','2027-04-30','L'],['2027-04-12','2027-04-17','P'],['2027-05-01','2027-05-01','H'],['2027-05-03','2027-05-29','L'],['2027-05-31','2027-06-01','E'],['2027-06-02','2027-06-06','H'],['2027-06-07','2027-07-24','E'],['2027-07-25','2027-08-22','H'],['2027-08-23','2027-09-11','E']].map(([a,b,c])=>[dt(a),dt(b),c]),
ph=d=>{let r;for(const[a,b,c]of PH)if(d>=a&&d<=b)r=c;return r},
MS=[];for(let d=new Date(T0.getFullYear(),T0.getMonth(),1);d<=dt('2027-09-01');d=new Date(d.getFullYear(),d.getMonth()+1,1))MS.push(['m'+d.getFullYear()+'-'+d.getMonth(),f(d,{month:'long',year:'numeric'})]);

function cal(){
 const B=ld('b2',[]),hm=new Date().toTimeString().slice(0,5),END=dt('2027-09-11'),D={day:'numeric',month:'long'};
 let h='',mo=-1;
 for(let d=new Date(T0);d<=END;d=add(d,1)){

// Scansione QR: fotocamera con jsQR, oppure foto, oppure codice scritto a mano
let ms=null,rq=0,lq='';
async function qo(id){S.q=id;lq='';$('#sc').hidden=false;$('#mc').value='';$('#sm').textContent='Avvio della fotocamera';
 try{ms=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vd');v.srcObject=ms;await v.play();$('#sm').textContent='Inquadra il QR sul tavolo.';qt()}
 catch(e){ms=null;$('#sm').textContent='Fotocamera non disponibile qui. Scegli una foto o scrivi il codice.'}}
function qt(){const v=$('#vd');if(!ms)return;
 if(v.readyState>=2&&window.jsQR){const w=Math.min(v.videoWidth,640),h=Math.round(w*v.videoHeight/v.videoWidth),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);const i=x.getImageData(0,0,w,h),r=jsQR(i.data,w,h);if(r&&r.data&&r.data!=lq){lq=r.data;if(qc(r.data))return}}
 rq=setTimeout(qt,200)}
function qf(i){const fl=i.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),r=window.jsQR&&jsQR(d.data,w,h);r?qc(r.data):$('#sm').textContent='Nessun QR trovato nella foto. Riprova.'};im.src=URL.createObjectURL(fl);i.value=''}
function qc(t){const A=ld('lb',[]),b=A.find(x=>x.id==S.q);if(!b)return;
 if(xp(b)){$('#sm').textContent='La prenotazione è scaduta e il posto è stato rilasciato.';return}
 if(t.trim().toUpperCase().replace('UNICATT-BIB|','')==cd(b)){b.st='ok';sv('lb',A);qx();tost('Posto confermato. Buono studio!');render();return true}
 $('#sm').textContent='Questo codice non corrisponde al posto prenotato ('+cd(b)+').'}
function qx(){clearTimeout(rq);if(ms)ms.getTracks().forEach(t=>t.stop());ms=null;$('#sc').hidden=true}

function wp(){if(!S.cf){S.cf=1;render();return}['b2','t','lb','em','vt','co','ct','th','mc','nt'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});S.cf=0;S.seat=null;ap();tost('Dati cancellati');render()}
function ifo(){return `<p><b>Unicatt Veloce</b></p><p class="mut">Versione 0.7, prototipo. Progetto indipendente: non è un'app ufficiale dell'Università Cattolica.</p><p><b>Cosa è reale</b></p><p class="mut">Le date di lezioni, esami, vacanze e recuperi vengono dal calendario della Facoltà di Economia (Milano) 2026/27. Sedi di Milano e codici delle aule (G, N, C, NI) vengono da elenchi pubblicati dall'università e potrebbero non essere aggiornati.</p><p><b>Cosa è un esempio</b></p><p class="mut">Orari, aule, docenti, appelli, voti, corsi online, libri e biblioteche sono dati inventati per mostrare come funziona l'app. Email di verifica e ordini sono simulati.</p><p><b>Sulla schermata Home</b></p><p class="mut">Safari: tocca Condividi, poi Aggiungi a Home. Chrome: apri il menu e scegli Aggiungi a schermata Home. Questa versione richiede la rete.</p><p><b>Link ufficiali</b></p><div class="in"><a href="https://studenticattolica.unicatt.it/" target="_blank" rel="noopener">Polo studenti</a><a href="https://icatt.unicatt.it/" target="_blank" rel="noopener">iCatt</a><a href="https://blackboard.unicatt.it/" target="_blank" rel="noopener">Blackboard</a><a href="https://studenticattolica.unicatt.it/durante-gli-studi-calendari-accademici" target="_blank" rel="noopener">Calendari accademici</a></div>`}
// ---- Oggi, promemoria, corsi seguiti, scadenza dei posti, export
const fw=k=>{const m=ld('mc',null);return !m||m.includes(k)},
dyL=d=>{const w=d.getDay();return ph(d)=='L'&&w>0&&w<6?L.filter(l=>l[1]==w&&C[l[0]].s==(d.getFullYear()<2027?1:2)&&fw(l[0])).sort((a,b)=>a[2]<b[2]?-1:1):[]},
bst=b=>{const d=dt(b.d);d.setHours(b.a);return +d},xp=b=>b.st!='ok'&&Date.now()>bst(b)+9e5,ddl=b=>new Date(bst(b)+9e5).toTimeString().slice(0,5),
dm=(a,b)=>{const[x,y]=a.split(':'),[p,q]=b.split(':');return(+x*60+ +y)-(+p*60+ +q)};
function tf(k){let m=ld('mc',null)||Object.keys(C);m=m.includes(k)?m.filter(x=>x!=k):m.concat(k);sv('mc',m);cl()}
function hom(){const hm=new Date().toTimeString().slice(0,5),B=ld('b2',[]),Q=ld('lb',[]),c=ph(T0),ls=dyL(T0),rm=[],D1={weekday:'long',day:'numeric',month:'long'};
 let nx=null;for(let d=new Date(T0),i=0;i<21&&!nx;d=add(d,1),i++){const a=dyL(d).filter(l=>+d>+T0||l[3]>hm);if(a.length)nx={d:new Date(d),l:a[0]}}
 B.forEach(id=>{const e=X.find(x=>x.id==id);if(e&&e.d>=T0&&e.d<=add(T0,14))rm.push([+e.d,'Esame di '+C[e.c].n,f(e.d,D1)+' alle '+e.t,'esa'])});
 X.forEach(e=>{if(fw(e.c)&&!B.includes(e.id)){const dl=add(e.d,-3);if(dl>=T0&&dl<=add(T0,3))rm.push([+dl,'Iscrizione a '+C[e.c].n+' in scadenza','Entro '+f(dl,D1),'esa'])}});
 Q.forEach(b=>{if(xp(b))return;const d=dt(b.d);if(d>=T0&&d<=add(T0,7))rm.push([bst(b),({mail:"Verifica l'email per ",qr:'Scansiona il QR per ',ok:'Posto confermato: '})[b.st]+LB.find(x=>x[0]==b.l)[1]+', posto '+b.s,f(d,D1)+', '+b.a+':00'+(b.st=='ok'?'':', entro le '+ddl(b)),'bib'])});
 rm.sort((a,b)=>a[0]-b[0]);
 let h=`<h2 style="margin-top:8px">${f(T0,D1)}</h2><p class="mut">${{L:'Giorno di lezione',E:"Sessione d'esami",P:'Prove intermedie',R:'Recupero lezioni',H:'Vacanze'}[c]||'Nessuna attività in calendario'}</p>`;
 if(nx){const od=+nx.d==+T0,cur=od&&nx.l[2]<=hm,m=od&&!cur?dm(nx.l[2],hm):0;
  h+=`<section class="pb pbE"><b>Prossima lezione</b><div><strong>${C[nx.l[0]].n}</strong></div><div class="mut">${od?'Oggi':f(nx.d,D1)}, ${nx.l[2]}–${nx.l[3]}</div><div class="mut">${rl(nx.l[4])}</div>${cur?'<span class="pill ok">In corso</span>':od?`<span class="pill">tra ${m<60?m+' min':Math.floor(m/60)+' h '+m%60+' min'}</span>`:''}</section>`}
 else h+='<p class="mut">Nessuna lezione nelle prossime tre settimane.</p>';
 if(ls.length)h+=`<div class="dy"><h3 class="dh td"><span>Oggi</span><span>${ls.length} ${ls.length>1?'lezioni':'lezione'}</span></h3>${ls.map(l=>{const n=hm>=l[2]&&hm<l[3];return `<div class="lr${n?' now':''}"${hm>=l[3]?' style="opacity:.55"':''}><div class="tm">${l[2]}<span>${l[3]}</span></div><div><b>${C[l[0]].n}</b><div class="mut">${rl(l[4])}</div>${n?'<span class="pill ok">In corso</span>':''}</div></div>`}).join('')}</div>`;
 h+='<p style="margin-top:20px"><b>Promemoria</b></p>'+(rm.length?rm.slice(0,6).map(([,t,u,g])=>`<div class="sd"><b>${t}</b><div class="mut">${u}</div><button class="lk" onclick="${g=='bib'?'S.bx=1;':''}go('${g}')">Apri</button></div>`).join(''):'<p class="mut">Nessun promemoria.</p>');
 return h}
const NT=new Set();
function ck(){if(!ld('nt',0)||typeof Notification=='undefined'||Notification.permission!='granted')return;
 const hm=new Date().toTimeString().slice(0,5);
 dyL(T0).forEach(l=>{const m=dm(l[2],hm),k='l'+l[0]+l[2];if(m>0&&m<=15&&!NT.has(k)){NT.add(k);try{new Notification('Lezione tra '+m+' minuti',{body:C[l[0]].n+', '+l[4]})}catch(e){}}});
 ld('lb',[]).forEach(b=>{const m=bst(b)+9e5-Date.now(),k='q'+b.id;if(b.st!='ok'&&m>0&&m<=9e5&&!NT.has(k)){NT.add(k);try{new Notification('Conferma il posto in biblioteca',{body:'Hai '+Math.ceil(m/6e4)+' minuti per scansionare il QR.'})}catch(e){}}})}
setInterval(ck,60000);
function nz(){if(ld('nt',0)){sv('nt',0);render();return}Notification.requestPermission().then(p=>{sv('nt',p=='granted'?1:0);tost(p=='granted'?'Notifiche attivate':'Permesso negato');render()}).catch(()=>tost('Notifiche non disponibili'))}
let DL=null;
try{window.claude&&claude.use&&claude.use('downloads').then(d=>{DL=d;if(S.t=='imp'||S.t=='cal')render()}).catch(()=>{})}catch(e){}
function ex(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',us=d=>String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear(),
 t12=t=>{let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+a},
 p2=n=>String(n).padStart(2,'0'),R=[['Subject','Start Date','Start Time','End Date','End Time','Description','Location']],B=ld('b2',[]);
 for(let d=new Date(T0);d<=dt('2027-09-11');d=add(d,1))dyL(d).forEach(l=>R.push([C[l[0]].n,us(d),t12(l[2]),us(d),t12(l[3]),C[l[0]].p,l[4]+', Università Cattolica, Milano']));
 X.filter(e=>B.includes(e.id)).forEach(e=>R.push(['Esame: '+C[e.c].n,us(e.d),t12(e.t),us(e.d),t12(p2(+e.t.slice(0,2)+2)+e.t.slice(2)),'',e.r+', Università Cattolica, Milano']));
 ld('lb',[]).filter(b=>!xp(b)).forEach(b=>{const n=LB.find(x=>x[0]==b.l)[1];R.push(['Biblioteca: '+n+', posto '+b.s,us(dt(b.d)),t12(p2(b.a)+':00'),us(dt(b.d)),t12(p2(b.a+b.n)+':00'),'Prenotazione biblioteca',n])});
 DL.save({filename:'unicatt-calendario.csv',data:'\ufeff'+R.map(r=>r.map(q).join(',')).join('\r\n')}).then(()=>tost('File salvato')).catch(e=>{if(e&&e.code!='declined')tost('Salvataggio non riuscito')})}
let tt;function tost(m){const e=$('#ts');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}
const NM={hom:'Oggi',cal:'Lezioni',cor:'Corsi',esa:'Esami',teo:'Teologia',bib:'Biblioteca',vot:'Voti',onl:'Corsi online',lib:'Libreria',mpp:'Mappa',imp:'Impostazioni',ifo:'Info'},
mn=o=>{$('#sd').classList.toggle('open',!!o);$('#ov').classList.toggle('open',!!o)},
jm=id=>{const e=id&&document.getElementById(id);e&&e.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})};
addEventListener('keydown',e=>e.key=='Escape'&&(mn(0),qx()));
function render(){const y=scrollY;$('main').innerHTML=({hom,cal,cor,esa,teo,bib,vot,onl,lib,mpp,imp,ifo})[S.t]()+'<p class="mut" style="margin-top:28px">Date di lezioni, esami e vacanze dal calendario della Facoltà di Economia (Milano) 2026/27. Orari, aule, docenti e appelli sono esempi.</p>';if(S.t=='cor')cl();if(S.t=='lib')bl();
 $('#ht').textContent=NM[S.t];
 $('#hc').innerHTML=S.t=='cal'?`<select aria-label="Vai a" onchange="jm(this.value);this.selectedIndex=0"><option value="">Vai a</option><option value="d${+T0}">Oggi</option>${MS.map(([i,n])=>`<option value="${i}">${n}</option>`).join('')}</select>`:'';
 document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.t));scrollTo(0,y)}
function go(t){S.t=t;S.rm=null;S.cf=0;mn(0);render();scrollTo(0,0)}
ap();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
